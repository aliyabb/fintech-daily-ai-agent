# Fintech Daily AI agent — configuration.
# No secrets here: keys live in .env (locally) or in GitHub Secrets.

feeds_file: feeds.opml
lookback_hours: 30        # only stories published within this many hours
max_candidates: 80        # how many pre-ranked stories the model chooses from
max_per_source: 6         # at most this many candidates from one outlet
exclude_url_patterns:     # event announcements and ads are not news
  - /event-info/
  - /webinar
  - /events/
  - /sponsored
exclude_title_words: [webinar, sponsored, "register now"]
min_items: 3              # fewer verified stories than this: no digest that day
max_items: 7
reserve_items: 3          # stories selected on top of max_items, to replace the ones checks drop
repeat_window_days: 10    # a story published in the channel within this many days is never repeated
repeat_title_similarity: 0.6   # share of common title words that marks a story as already published
article_chars: 6000       # how much of the main article the writer sees
secondary_article_chars: 2500   # how much of each additional source of the same story

llm:
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  api_key_env: GEMINI_API_KEY
  models: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.1-flash-lite]   # in order: the next one if the previous is unavailable
  # Model routing per step. Steps are spread over two Flash models so that each fits the free tier's daily quota;
  # facts are checked by a different model than the one that wrote the text.
  steps:
    selection: [gemini-3.7-flash, gemini-3.8-flash, gemini-3.1-flash-lite]   # choose the stories
    digest: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.1-flash-lite]      # write
    repair: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.1-flash-lite]      # fix what the checks flagged
    verdicts: [gemini-3.7-flash, gemini-3.8-flash, gemini-3.1-flash-lite]    # fact-check
    weekly: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.1-flash-lite]      # week in review (once a week)
    rewrite: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.1-flash-lite]     # "Rewrite" on the editor's request
  rpm: {gemini-3.8-flash: 5, gemini-3.7-flash: 5, gemini-3.1-flash-lite: 15}   # requests per minute
  # "Patient" selection: when 3.7 and 3.8 are overloaded the bot waits and retries (20 s, 40 s) and uses Flash Lite
  # only in the last round: it follows instructions such as "do not repeat stories" less reliably.
  # Selection only, 3 rounds only: "overloaded" (503) answers appear to count toward the daily quota,
  # so every extra wait costs quota. Repeats that slip through selection are caught by the fact-check.
  last_resort: [gemini-3.1-flash-lite]
  patient_steps: [selection]
  rounds: 3
  round_delay_seconds: 20
  temperature: 0.3
  timeout_seconds: 180
  budget_seconds: 720         # at most 12 minutes per digest
  # Paid-tier (Standard) prices, $ per 1M tokens: only to estimate what a post would cost; the bot runs on the free
  # tier. Output includes thinking tokens. Google sources, 2026-10: 3.8 Flash on cloud.google.com (Agent Platform
  # pricing), 3.7 Flash on blog.google (launch post), 3.1 Flash-Lite on ai.google.dev/gemini-api/docs/pricing.
  # 3.8 and 3.7 Flash are at an introductory price until 2026-12-31; from 2027-01-01: $1.50 input / $7.50 output.
  pricing:
    gemini-3.8-flash: {input: 0.75, output: 3.75}
    gemini-3.7-flash: {input: 0.75, output: 3.75}
    gemini-3.1-flash-lite: {input: 0.25, output: 1.50}

# Prompt evaluation (python -m newsbot eval / eval-live). The live evaluation spends requests, so it runs only with
# a separate key from another Google AI Studio project: it has its own free quota, never shared with the digests.
eval:
  api_key_env: EVAL_GEMINI_API_KEY
  days: 3                     # how many of the channel's latest issues the current prompts rewrite
  steps:
    digest: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.1-flash-lite]   # the current writer prompt
    judge: [gemini-3.7-flash, gemini-3.8-flash, gemini-3.1-flash-lite]    # the judge: not the model that wrote

moderation:
  # Default publishing mode, switched with the bot commands /auto and /manual (the choice is kept in the state branch).
  # auto: posts go out on their own, the draft carries a "Do not publish" button; manual: only after "Publish".
  mode: auto
  auto_veto_minutes: 20       # in auto mode a post goes out no sooner than this after the draft reached the editor
  approval_wait_hours: 2      # how long to wait for approval after the publish time
  max_rewrites: 2             # "Rewrite" presses allowed per issue (each costs 2 model requests)
  prepare_time_utc: "23:13"       # all channels' drafts, together
  prepare_window_minutes: 75      # how long after that the bot keeps trying to build and send the drafts
  # Wake-ups (an external scheduler, UTC). On each wake-up the bot does whatever is due and nothing else:
  # builds drafts in the morning window, publishes a channel in its window, reads editor commands.
  wake_hours_utc: [23, 0, 1, 2, 3, 5, 6, 7, 8, 9, 10]
  wake_minutes: [13, 43]
  command_hours_utc: [12, 15, 18, 21]   # daytime: only read the /auto, /manual, /mode commands
  # On-the-minute publishing: a wake-up one minute before each channel's time (zh 08:30 Singapore, ru 08:30 Moscow,
  # en 07:30 UTC); the bot waits for the exact minute and publishes.
  publish_wake_utc: ["00:29", "05:29", "07:29"]
  publish_lead_minutes: 3     # if the publish time is at most this many minutes away, wait instead of leaving
  admin_timezone: Asia/Shanghai   # time zone of the times shown to the editor
  first_publish_date: "2026-09-17"  # scheduled runs before this date do nothing

weekly:                     # week in review: Mondays, right before the morning digest
  enabled: true
  weekday: 0                # 0 is Monday
  min_stories: 10           # fewer stories published that week: no review
  min_items: 4              # fewer lines after the number check: no review

source_weights:             # weight of each feeds.opml folder when ranking candidates
  A-Daily: 1.0
  B-Newsletters: 0.9
  C-Media: 0.9
  D-Crypto: 0.7
  E-Research-VC-Companies: 0.8
  F-Regulators: 1.0
  G-Reddit: 0.3
  H-Asia: 0.9
  I-LATAM: 0.8
  J-Africa: 0.8
  K-MENA: 0.8

